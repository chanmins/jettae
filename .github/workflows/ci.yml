name: CI

# 배포는 여기서 하지 않는다. 로컬에서 `npm run deploy` 로 올린다.
#
# 원래는 이 워크플로가 Firebase Hosting까지 배포했는데, 서비스 계정을 만들려면
# 프로젝트에 IAM API를 켜야 해서 그 단계를 접었다. 시크릿 없이 배포 단계만 남겨두면
# push할 때마다 빨간 X가 뜨고, 그게 일상이 되면 진짜 고장도 같은 모양이라 놓친다.
#
# 배포를 다시 붙이려면 맨 아래 주석을 보면 된다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 의존성 설치
        run: npm ci --prefix app

      # 저장소와 생성물이 어긋나지 않게 한다.
      # 카탈로그 JSON을 고치고 시드를 다시 만들지 않았거나, core를 고치고
      # 엣지 함수 쪽 사본을 동기화하지 않았으면 여기서 걸린다.
      - name: 생성물이 최신인지 확인
        run: |
          node scripts/gen-catalog-sql.mjs
          node scripts/sync-core.mjs
          if ! git diff --quiet; then
            echo "::error::생성물이 원본과 어긋나 있어요. 로컬에서 'npm run seed && npm run sync:core' 후 커밋해주세요."
            git --no-pager diff --stat
            exit 1
          fi

      - name: 타입 검사
        run: npm run typecheck --prefix app

      - name: 테스트
        run: npm run test --prefix app

      - name: 빌드
        run: npm run build --prefix app

  # core/ 는 앱과 엣지 함수가 함께 쓰는 코드다. Deno 쪽에서도 컴파일되는지 본다.
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: 엣지 함수 타입 검사
        working-directory: supabase/functions
        run: deno check notify-dispatch/index.ts notify-respond/index.ts push-health/index.ts

