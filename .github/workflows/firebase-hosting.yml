name: Deploy to Firebase Hosting

# 제때는 fitlog과 달리 정적 파일이 아니라 Vite 앱이다.
# 그래서 배포 전에 빌드가 한 번 돌아야 하고, 빌드가 깨지면 배포도 멈춰야 한다.

on:
  push:
    branches: [main]
  # 배포 없이 빌드만 확인하고 싶을 때
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 연달아 밀어 넣으면 마지막 것만 올라가면 된다
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 의존성 설치
        run: npm ci --prefix app

      # 배포되는 것과 저장소가 어긋나지 않게 한다.
      # 카탈로그 JSON을 고치고 시드를 다시 만들지 않았거나, core를 고치고
      # 엣지 함수 쪽 사본을 동기화하지 않았으면 여기서 걸린다.
      - name: 생성물이 최신인지 확인
        run: |
          node scripts/gen-catalog-sql.mjs
          node scripts/sync-core.mjs
          if ! git diff --quiet; then
            echo "::error::생성물이 원본과 어긋나 있어요. 로컬에서 'npm run seed && npm run sync:core' 후 커밋해주세요."
            git --no-pager diff --stat
            exit 1
          fi

      - name: 타입 검사
        run: npm run typecheck --prefix app

      - name: 테스트
        run: npm run test --prefix app

      - name: 빌드
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build --prefix app

      # 프로젝트 ID의 출처는 .firebaserc 하나다.
      # `firebase use --add`가 그 파일을 관리하므로, 여기서 읽으면 로컬 배포와
      # CI 배포가 같은 곳을 보게 된다. 따로 적어두면 언젠가 한쪽만 바뀐다.
      - name: Firebase 프로젝트 ID 읽기
        id: firebase
        run: |
          # .firebaserc 는 확장자가 .json 이 아니라 require() 로는 못 읽는다.
          # (JS 로 파싱돼 SyntaxError 가 난다 — 읽어서 JSON.parse 해야 한다)
          ID=$(node -p "JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects.default || ''")
          if [ -z "$ID" ] || [ "$ID" = "REPLACE_WITH_FIREBASE_PROJECT_ID" ]; then
            echo "::error::.firebaserc에 프로젝트 ID가 없어요. 로컬에서 'firebase use --add'를 돌리고 커밋해주세요."
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "배포 대상: $ID"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ steps.firebase.outputs.id }}
          channelId: live

# 필요한 설정 (한 번만)
#
#   1. 로컬에서  firebase use --add  → .firebaserc 에 프로젝트 ID가 적힌다. 커밋한다.
#   2. 로컬에서  firebase init hosting:github  → 저장소에
#      FIREBASE_SERVICE_ACCOUNT 시크릿이 자동으로 들어간다.
#
#   아래 셋은 없어도 앱이 뜬다. 비어 있으면 IndexedDB만 쓰는 로컬 모드로 동작하고,
#   계정 동기화와 푸시 알림만 꺼진다.
#     Settings → Secrets and variables → Actions → Variables
#       VITE_SUPABASE_URL
#       VITE_SUPABASE_ANON_KEY
#       VITE_VAPID_PUBLIC_KEY
