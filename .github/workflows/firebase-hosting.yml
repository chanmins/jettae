name: Deploy to Firebase Hosting

# 제때는 fitlog과 달리 정적 파일이 아니라 Vite 앱이다.
# 그래서 배포 전에 빌드가 한 번 돌아야 하고, 빌드가 깨지면 배포도 멈춰야 한다.

on:
  push:
    branches: [main]
  # 배포 없이 빌드만 확인하고 싶을 때
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 연달아 밀어 넣으면 마지막 것만 올라가면 된다
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 의존성 설치
        run: npm ci --prefix app

      # 배포되는 것과 저장소가 어긋나지 않게 한다.
      # 카탈로그 JSON을 고치고 시드를 다시 만들지 않았거나, core를 고치고
      # 엣지 함수 쪽 사본을 동기화하지 않았으면 여기서 걸린다.
      - name: 생성물이 최신인지 확인
        run: |
          node scripts/gen-catalog-sql.mjs
          node scripts/sync-core.mjs
          if ! git diff --quiet; then
            echo "::error::생성물이 원본과 어긋나 있어요. 로컬에서 'npm run seed && npm run sync:core' 후 커밋해주세요."
            git --no-pager diff --stat
            exit 1
          fi

      - name: 타입 검사
        run: npm run typecheck --prefix app

      - name: 테스트
        run: npm run test --prefix app

      - name: 빌드
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build --prefix app

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live

# 필요한 설정 (한 번만)
#
#   Settings → Secrets and variables → Actions
#     Secrets   FIREBASE_SERVICE_ACCOUNT   Firebase 콘솔이 만들어주는 서비스 계정 JSON
#     Variables FIREBASE_PROJECT_ID        예: jettae-1234
#
#   아래 셋은 없어도 앱이 뜬다. 비어 있으면 IndexedDB만 쓰는 로컬 모드로 동작하고,
#   계정 동기화와 푸시 알림만 꺼진다.
#     Variables VITE_SUPABASE_URL
#               VITE_SUPABASE_ANON_KEY
#               VITE_VAPID_PUBLIC_KEY
#
# 서비스 계정은 Firebase 콘솔에서 이 저장소를 연결하면 자동으로 만들어진다:
#   firebase init hosting:github   (또는 콘솔 → Hosting → GitHub 연결)
